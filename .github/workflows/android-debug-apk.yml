name: Build Touch Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/setup-restore-v6]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: touch-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Touch-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Publish APK as pre-release
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          FILES=(app/build/outputs/apk/debug/app-debug.apk)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no APK found"; exit 1; }
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" "${FILES[@]}" \
            --target "${{ github.sha }}" --prerelease \
            --title "APK build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}"
